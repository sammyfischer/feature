[package]
name = "feature"
version = "5.0.0"
edition = "2024"
repository = "https://github.com/sammyfischer/feature"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.5.4", features = ["derive"] }
clap_complete = "4"
console = "0.16.2"
dialoguer = "0.12.0"
dirs = "6.0.0"
figment = { version = "0.10.19", features = ["env", "toml"] }
git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-openssl"] }
indexmap = { version = "2.14.0", features = ["rayon", "serde"] }
indicatif = "0.18.4"
rayon = "1.12.0"
regex = "1.12.3"
schemars = { version = "1.2.1", features = ["indexmap2"] }
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_json = "1.0.149"
toml = "1.0.3"
toml_edit = "0.25.11"
unicode-width = "0.2.2"
which = "8.0.2"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.25.0"
